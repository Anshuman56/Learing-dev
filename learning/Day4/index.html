<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>

  <body>
    <div class="card">
      <div class="lebel">guess the number</div>
      <h1>1 to 100</h1>

        <div><strong id="attempts">0</strong>Attempts</div>

      </div>
    </div>
    <script src="script.js"></script>
  </body>
